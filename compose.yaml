services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CACHE_DATABASE_URL: postgresql+asyncpg://cache:cache@db:5432/cache
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      # Local development credentials only.
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: cache
      POSTGRES_DB: cache
    ports:
      - "5432:5432"  # published so the repository tests can run against it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache -d cache"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
